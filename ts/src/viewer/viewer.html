<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rig dev stream</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fff; --fg: #1c1c1c; --mu: #6b6f76; --ln: #e4e6e9; --sub: #f5f6f7; --hi: #0b6bcb; --bad: #c0392b; --warn: #a8660a;
  --primary: #8250df; --guide: #0f7b8a; --focuser: #a8590a; --mount: #1a7f37; --box: #b0397a; --sys: #3f6fb5; --phd: #7c5cbf; --cli: #4a7a3a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0f12; --fg: #e8e8e8; --mu: #9aa0a6; --ln: #2a2d32; --sub: #171a1e; --hi: #6cb2ff; --bad: #ff7b72; --warn: #e3b341;
    --primary: #b9a0f5; --guide: #5cc8d8; --focuser: #e6a95c; --mount: #7ee2a0; --box: #f08fc0; --sys: #8ab4f0; --phd: #b39ddb; --cli: #a5d68f;
  }
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, sans-serif }
header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--ln) }
.bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px 0 }
h1 { font-size: 15px; font-weight: 600; margin: 0 }
#status { color: var(--mu); font-variant-numeric: tabular-nums; flex: 1 1 auto }
#status.down { color: var(--bad); font-weight: 600 }
input[type=search] { flex: 1 1 260px }
input { min-width: 0; font: inherit; padding: 4px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--ln); border-radius: 4px }
button { font: inherit; padding: 3px 9px; background: var(--bg); color: var(--fg); border: 1px solid var(--ln); border-radius: 4px; cursor: pointer }
button:hover { background: var(--sub) }
button:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--hi); outline-offset: -2px }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center }
.chip { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 8px; border-radius: 10px; font-size: 12px; color: var(--mu) }
.chip b { font-weight: 500; color: var(--tone, var(--fg)) }
.chip span { font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--tone, var(--hi)) 16%, transparent); border-color: var(--tone, var(--hi)) }
.gap { width: 8px }
#range[hidden] { display: none }
#windows .chip { padding: 1px 10px }
#hidden:empty { display: none }
#hidden::before { content: 'Hidden:'; color: var(--mu); font-size: 12px; margin-right: 2px }
.columns, .row { display: grid; grid-template-columns: 7ch 12ch 3ch 8ch 24ch minmax(0, 1fr); gap: 0 10px; padding: 2px 12px; font: 12px/1.45 ui-monospace, Menlo, monospace }
.columns { color: var(--mu); margin-top: 6px; border-top: 1px solid var(--ln); padding-top: 3px; padding-bottom: 3px }
.row { border-bottom: 1px solid color-mix(in srgb, var(--ln) 60%, transparent); cursor: pointer; align-items: baseline }
.row[hidden] { display: none }
.row:hover { background: var(--sub) }
.seq, .ms, .src, .state, .k { color: var(--mu) }
.seq, .at { font-variant-numeric: tabular-nums }
.who { color: var(--tone, var(--mu)) }
.what, .detail { overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
.detail { color: color-mix(in srgb, var(--fg) 82%, var(--mu)) }
.state { margin-right: 8px }
.k { margin-left: 8px }
.k:first-of-type { margin-left: 0 }
.primary { --tone: var(--primary) } .guide { --tone: var(--guide) } .focuser { --tone: var(--focuser) } .mount { --tone: var(--mount) } .box { --tone: var(--box) }
.system { --tone: var(--sys) } .phd2 { --tone: var(--phd) } .client { --tone: var(--cli) }
.row .src { color: var(--mu) }
.row.out .src, .row.system .src, .row.phd2 .src, .row.client .src { color: var(--tone, var(--hi)) }
.row.command { background: color-mix(in srgb, var(--hi) 7%, transparent) }
.row.command .src { color: var(--hi); font-weight: 600 }
.row.problem { box-shadow: inset 2px 0 0 var(--bad) }
.row.problem .state, .row.problem .detail { color: var(--bad) }
.row.quiet .detail { color: var(--mu) }
.group { grid-template-columns: 8ch 26ch minmax(0, 1fr) 8ch 8ch 7ch 7ch; }
.columns.table { grid-template-columns: 8ch 26ch minmax(0, 1fr) 8ch 8ch 7ch 7ch }
.group .age, .group .number, .columns.table .right { text-align: right; font-variant-numeric: tabular-nums; color: var(--mu) }
.group.fresh { animation: fresh 1.2s ease-out }
@keyframes fresh { from { background: color-mix(in srgb, var(--tone, var(--hi)) 22%, transparent) } to { background: transparent } }
main[hidden], .columns[hidden] { display: none }
.more { display: none; grid-column: 1 / -1; margin: 4px 0 6px; padding: 8px 10px; background: var(--sub); border-radius: 4px; cursor: auto }
.row.open .more { display: block }
.row.open .what, .row.open .detail { white-space: normal; overflow-wrap: anywhere }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 12px; margin: 0 0 6px }
.facts dt { color: var(--mu) } .facts dd { margin: 0; overflow-wrap: anywhere }
.more pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit }
.actions { display: flex; flex-wrap: wrap; gap: 4px }
.actions button { font-size: 11px; padding: 1px 7px }
#empty { color: var(--mu); padding: 16px 12px; margin: 0 }
@media (max-width: 720px) {
  .columns { display: none }
  .row { grid-template-columns: 12ch 3ch minmax(0, 1fr) }
  .seq { display: none }
  .what, .detail { grid-column: 1 / -1 }
  .group { grid-template-columns: 8ch minmax(0, 1fr) 7ch 7ch }
  .group .what { grid-column: auto }
  .group .detail { grid-column: 1 / -1; order: 1 }
  .group .number { display: none }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Rig dev stream</h1>
    <span id="status" role="status">Connecting</span>
    <button id="pause" type="button">Pause</button>
  </div>
  <div class="bar">
    <div class="chips" id="views" role="group" aria-label="View"></div>
    <div class="chips" id="windows" role="group" aria-label="Time window"></div>
    <div class="chips" id="range" hidden>
      <input id="from" type="datetime-local" step="1" aria-label="From"><span class="k">to</span><input id="to" type="datetime-local" step="1" aria-label="To">
      <button id="apply" type="button">Show</button>
    </div>
  </div>
  <div class="bar">
    <input id="search" type="search" placeholder="Search what's shown, or prop:COORD state:Alert who:kernel -debug" aria-label="Search entries">
    <button id="clear" type="button">Clear</button>
  </div>
  <div class="bar">
    <div class="chips" id="show" role="group" aria-label="Show only"></div>
    <div class="chips" id="hidden" aria-label="Hidden properties"></div>
  </div>
  <div class="columns" id="logColumns" aria-hidden="true"><span>seq</span><span>time ET</span><span>src</span><span>who</span><span>what</span><span>detail</span></div>
  <div class="columns table" id="tableColumns" aria-hidden="true" hidden><span>who</span><span>property</span><span>latest</span><span class="right">read</span><span class="right">changed</span><span class="right">reads</span><span class="right">changes</span></div>
</header>
<p id="empty" hidden></p>
<main id="rows"></main>
<main id="table" hidden></main>
<script type="module">
const { rowsKeptOnPage } = await (await fetch('settings')).json()
const rows = document.getElementById('rows')
const table = document.getElementById('table')
const groups = new Map()
const empty = document.getElementById('empty')
const statusLine = document.getElementById('status')
const search = document.getElementById('search')
const pauseButton = document.getElementById('pause')
const clock = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
const stamp = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
const xml = new DOMParser()
const sources = ['primary', 'guide', 'focuser', 'mount', 'box', 'server', 'other', null, 'system', 'phd2', 'client']
const flags = [['commands', 'Commands'], ['problems', 'Problems'], ['changes', 'Changes only']]
const windows = [['15 min', '15m', 900000], ['1 hour', '1h', 3600000], ['6 hours', '6h', 21600000], ['24 hours', '24h', 86400000], ['7 days', '7d', 604800000]]
const counts = new Map()
const meta = new WeakMap()
const held = []
const recent = []
let paused = false
let connected = false
let shown = 0
let kept = 0
let matched = 0
let reading = 0
let phase = 'reading'
let openedAt = 0
let liveSince = 0
let events = null

const hash = new URLSearchParams(location.hash.slice(1))
const filter = {
  show: new Set((hash.get('show') ?? '').split(',').filter(Boolean)),
  commands: hash.has('commands'),
  problems: hash.has('problems'),
  changes: hash.has('changes'),
  hidden: new Set((hash.get('hide') ?? '').split(',').filter(Boolean)),
  view: hash.has('table') ? 'table' : 'log',
  window: hash.get('window') ?? '15m',
  from: hash.get('from') ?? '',
  to: hash.get('to') ?? '',
}

search.value = hash.get('q') ?? ''

function element(tag, className, text) {
  const made = document.createElement(tag)

  if (className) made.className = className
  if (text !== undefined) made.textContent = text

  return made
}

function shortNumber(text) {
  const value = Number(text)

  return text !== '' && Number.isFinite(value) ? String(Number(value.toFixed(6))) : text
}

function describeWire(entry, subject) {
  const device = subject.split('.')[2]
  const root = xml.parseFromString(entry.body.xml, 'text/xml').documentElement
  const base = { source: device, who: device, label: entry.body.dir, what: '', state: '', pairs: [], text: '', quiet: false }

  if (root.querySelector('parsererror') || root.nodeName === 'parsererror') return { ...base, what: 'unreadable', text: entry.body.xml.trim() }

  const tag = root.nodeName

  if (tag === 'message') {
    const text = root.getAttribute('message') ?? ''

    return { ...base, what: 'message', text, quiet: text.includes('[DEBUG]') }
  }

  const state = root.getAttribute('state') ?? ''
  const name = root.getAttribute('name') ?? ''
  const children = [...root.children].map(child => [child.getAttribute('name') ?? child.nodeName, child.textContent.trim()])
  const isSwitch = tag.endsWith('SwitchVector')
  const pairs = children.filter(([, value]) => !isSwitch || value === 'On').map(([key, value]) => [key, shortNumber(value)])

  if (tag.startsWith('new')) return { ...base, label: 'cmd', what: name, pairs }
  if (tag.startsWith('def')) return { ...base, what: name, state, pairs, text: pairs.length === 0 ? 'defined' : '', quiet: true }
  if (tag.startsWith('set')) return { ...base, what: name, state, pairs }

  return { ...base, what: name || tag, text: name ? tag : '', quiet: true }
}

function describeSystem(entry) {
  const base = { source: 'system', label: 'sys', what: '', state: '', pairs: [] }

  if (typeof entry.body === 'string') return { ...base, who: 'journal', text: entry.body, quiet: false }

  const message = entry.body.MESSAGE
  const text = typeof message === 'string' ? message : JSON.stringify(message)
  const priority = Number(entry.body.PRIORITY)

  return {
    ...base,
    who: entry.body.SYSLOG_IDENTIFIER ?? entry.body._COMM ?? 'journal',
    what: entry.body._SYSTEMD_USER_UNIT ?? entry.body._SYSTEMD_UNIT ?? '',
    text,
    quiet: priority >= 6 && priority !== 6,
  }
}

function describePhd2(entry) {
  const event = entry.kind.slice('phd2.'.length)
  const base = { source: 'phd2', who: 'phd2', label: 'phd', what: event, state: '', quiet: false }

  if (typeof entry.body === 'string') return { ...base, pairs: [], text: entry.body }

  const { Event, Timestamp, Host, Inst, ...rest } = entry.body

  return { ...base, pairs: Object.entries(rest).map(([key, value]) => [key, typeof value === 'number' ? shortNumber(String(value)) : String(value)]), text: '' }
}

function describeClient(entry) {
  const base = { source: 'client', who: entry.source.split(':').at(-1), label: 'cli', state: '', text: '', quiet: false }

  if (entry.kind === 'client.connection') {
    const { target, status, error } = entry.body

    return { ...base, what: `connection ${target}`, state: status, pairs: [], text: error ?? '' }
  }

  const { connection, version, sources: published } = entry.body

  return { ...base, what: 'connected', pairs: [['connection', String(connection)], ...(version === undefined ? [] : [['version', String(version)]]), ['sources', published.join(', ')]] }
}

function describe(entry, subject) {
  if (entry.kind === 'wire') return describeWire(entry, subject)
  if (entry.kind.startsWith('client.')) return describeClient(entry)

  return entry.kind === 'system' ? describeSystem(entry) : describePhd2(entry)
}

function tokenMatches(token, view) {
  const field = /^(who|what|prop|state|kind|id|src):(.+)$/.exec(token)

  if (!field) return view.haystack.includes(token)

  const [, key, wanted] = field

  const value = { who: view.who, what: view.what, prop: view.what, state: view.state, kind: view.entry.kind, id: view.entry.id, src: view.label }[key]

  return value.toLowerCase().includes(wanted)
}

function passes(view) {
  if (filter.hidden.has(view.what)) return false

  return search.value.toLowerCase().split(/\s+/).filter(Boolean).every(token =>
    token.startsWith('-') && token.length > 1 ? !tokenMatches(token.slice(1), view) : tokenMatches(token, view))
}

function setShown(row, view) {
  const visible = passes(view)

  if (row.hidden === visible) shown += visible ? 1 : -1
  row.hidden = !visible
}

function applyFilter() {
  if (filter.view === 'table') drawTable()
  for (const row of rows.querySelectorAll('.row')) setShown(row, meta.get(row))
  saveFilter()
  drawChips()
  showStatus()
}

function saveFilter() {
  const next = new URLSearchParams()

  if (filter.window === 'range') {
    next.set('from', filter.from)
    next.set('to', filter.to)
  } else next.set('window', filter.window)
  if (filter.view === 'table') next.set('table', '')
  if (filter.show.size > 0) next.set('show', [...filter.show].join(','))
  if (filter.commands) next.set('commands', '')
  if (filter.problems) next.set('problems', '')
  if (filter.changes) next.set('changes', '')
  if (filter.hidden.size > 0) next.set('hide', [...filter.hidden].join(','))
  if (search.value !== '') next.set('q', search.value)
  history.replaceState(null, '', `#${next}`)
}

function chip(label, key, pressed, tone, onClick) {
  const made = element('button', `chip ${tone}`)

  made.type = 'button'
  made.setAttribute('aria-pressed', String(pressed))
  const number = element('span', '', (counts.get(key) ?? 0).toLocaleString())

  number.dataset.count = key
  made.append(element('b', '', label), number)
  made.addEventListener('click', onClick)

  return made
}

function drawChips() {
  const show = document.getElementById('show')
  const hidden = document.getElementById('hidden')

  show.replaceChildren(
    ...sources.map(source => source === null ? element('span', 'gap') : chip(source, source, filter.show.has(source), source, () => {
      if (filter.show.has(source)) filter.show.delete(source)
      else filter.show.add(source)
      refilter()
    })),
    element('span', 'gap'),
    ...flags.filter(([key]) => filter.view === 'log' || key === 'problems').map(([key, label]) => chip(label, key, filter[key], '', () => {
      filter[key] = !filter[key]
      refilter()
    })),
  )
  drawViews()
  drawWindows()
  hidden.replaceChildren(...[...filter.hidden].map(name => {
    const made = element('button', 'chip')

    made.type = 'button'
    made.textContent = `${name} ×`
    made.setAttribute('aria-label', `Show ${name} again`)
    made.addEventListener('click', () => {
      filter.hidden.delete(name)
      applyFilter()
    })

    return made
  }))
}

function refilter() {
  if (filter.view === 'table') {
    drawTable()
    saveFilter()
    drawChips()
    showStatus()
  } else {
    openEvents()
  }
}

function drawViews() {
  document.getElementById('views').replaceChildren(...[['Log', 'log'], ['Latest by property', 'table']].map(([label, key]) => {
    const made = element('button', 'chip', label)

    made.type = 'button'
    made.setAttribute('aria-pressed', String(filter.view === key))
    made.addEventListener('click', () => {
      filter.view = key
      openEvents()
    })

    return made
  }))
}

function drawWindows() {
  const choices = windows.map(([label, key]) => [label, key])

  document.getElementById('windows').replaceChildren(...[...choices, ['Range', 'range']].map(([label, key]) => {
    const made = element('button', 'chip', label)

    made.type = 'button'
    made.setAttribute('aria-pressed', String(filter.window === key))
    made.addEventListener('click', () => {
      filter.window = key
      if (key === 'range') {
        document.getElementById('range').hidden = false
        drawChips()
      } else {
        openEvents()
      }
    })

    return made
  }))
  document.getElementById('range').hidden = filter.window !== 'range'
}

function addCounts(added) {
  for (const [key, value] of Object.entries(added.counts)) counts.set(key, (counts.get(key) ?? 0) + value)
  matched += added.matched
}

function action(label, onClick) {
  const made = element('button', '', label)

  made.type = 'button'
  made.addEventListener('click', onClick)

  return made
}

function moreOf(view, subject) {
  const more = element('div', 'more')
  const facts = element('dl', 'facts')
  const { body, ...outer } = view.entry
  const when = new Date(view.entry.at)

  for (const [name, value] of [
    ['subject', subject],
    ['id', outer.id],
    ['kind', outer.kind],
    ['at', `${stamp.format(when)}.${String(when.getMilliseconds()).padStart(3, '0')} ET`],
    ['source', outer.source],
    ['rig', outer.rig],
    ['seq', view.seq],
  ]) facts.append(element('dt', '', name), element('dd', '', String(value)))

  const actions = element('div', 'actions')

  actions.append(action(`Only ${view.source}`, () => {
    filter.show = new Set([view.source])
    openEvents()
  }))
  if (view.what !== '') {
    actions.append(
      action(`Only ${view.what}`, () => {
        search.value = `what:${view.what}`
        applyFilter()
      }),
      action(`Hide ${view.what}`, () => {
        filter.hidden.add(view.what)
        applyFilter()
      }),
    )
  }
  actions.append(action('Copy entry', () => void navigator.clipboard?.writeText(JSON.stringify(view.entry, null, 2))))
  more.append(facts, actions, element('pre', '', typeof body?.xml === 'string' ? body.xml.trim() : JSON.stringify(body, null, 2)))
  more.addEventListener('click', event => event.stopPropagation())

  return more
}

function toggle(row) {
  const open = row.classList.toggle('open')

  if (open && !row.querySelector('.more')) row.append(moreOf(meta.get(row), meta.get(row).subject))
}

function detailOf(view) {
  const detail = element('span', 'detail')

  if (view.state !== '') detail.append(element('span', 'state', view.state))
  for (const [key, value] of view.pairs) detail.append(element('span', 'k', `${key} `), value)
  if (view.text !== '') detail.append(view.text)

  return detail
}

function rowOf(message) {
  const entry = JSON.parse(message.text)
  const view = { ...describe(entry, message.subject), problem: message.problem, command: message.command, entry, subject: message.subject, seq: message.seq }
  const when = new Date(entry.at)
  const row = element('div', `row ${view.source} ${entry.kind === 'wire' ? entry.body.dir : ''} ${view.command ? 'command' : ''} ${view.problem ? 'problem' : ''} ${view.quiet ? 'quiet' : ''}`)
  const time = element('span', 'at', clock.format(when))
  const what = element('span', 'what', view.what)

  view.haystack = `${view.who} ${view.what} ${view.state} ${message.text}`.toLowerCase()
  what.title = view.what
  time.append(element('span', 'ms', `.${String(when.getMilliseconds()).padStart(3, '0')}`))
  row.tabIndex = 0
  row.hidden = true
  row.append(element('span', 'seq', message.seq), time, element('span', 'src', view.label), element('span', 'who', view.who), what, detailOf(view))
  meta.set(row, view)
  setShown(row, view)

  return row
}

function add(message) {
  rows.prepend(rowOf(message))
  kept += 1
  while (kept > rowsKeptOnPage) {
    if (!rows.lastElementChild.hidden) shown -= 1
    rows.lastElementChild.remove()
    kept -= 1
  }
}

function addHistory(entries) {
  const batch = document.createDocumentFragment()

  for (const message of entries.toReversed()) batch.append(rowOf(message))
  rows.prepend(batch)
  kept += entries.length
}

function age(from) {
  if (from === undefined || from === null) return '–'

  const seconds = Math.max(0, Math.round((Date.now() - from) / 1000))

  if (seconds < 90) return `${seconds} s`
  if (seconds < 5400) return `${Math.round(seconds / 60)} min`

  return `${(seconds / 3600).toFixed(1)} h`
}

function groupView(group) {
  const entry = JSON.parse(group.latest.text)

  return { ...describe(entry, group.latest.subject), problem: group.latest.problem, entry }
}

function groupPasses(group) {
  const view = groupView(group)

  if (filter.show.size > 0 && !filter.show.has(view.source)) return false
  if (filter.problems && !view.problem) return false

  return passes({ ...view, haystack: `${view.who} ${view.what} ${view.state} ${group.latest.text}`.toLowerCase() })
}

function fillGroupRow(row, group) {
  const view = groupView(group)

  row.className = `row group ${view.source} ${view.problem ? 'problem' : ''}`
  row.replaceChildren(
    element('span', 'who', view.who),
    element('span', 'what', view.what),
    detailOf(view),
    element('span', 'age', age(group.latest.at)),
    element('span', 'age', age(group.changedAt)),
    element('span', 'number', group.reads.toLocaleString()),
    element('span', 'number', group.changes.toLocaleString()),
  )
  row.dataset.key = group.group
}

function drawTable() {
  const visible = [...groups.values()].filter(groupPasses).sort((a, b) => a.group.localeCompare(b.group))

  table.replaceChildren(...visible.map(group => {
    const row = element('div', '')

    fillGroupRow(row, group)
    row.tabIndex = 0

    return row
  }))
  shown = visible.length
}

function updateGroup(message) {
  if (message.group === undefined || message.group === null) return

  const known = groups.get(message.group)
  const group = {
    group: message.group,
    latest: message,
    reads: (known?.reads ?? 0) + 1,
    changes: (known?.changes ?? 0) + (message.differs ? 1 : 0),
    changedAt: message.differs ? message.at : known?.changedAt,
  }

  groups.set(message.group, group)

  const row = table.querySelector(`[data-key="${CSS.escape(message.group)}"]`)

  if (row === null || known === undefined) {
    drawTable()
    return
  }

  fillGroupRow(row, group)
  row.classList.toggle('fresh', false)
  if (message.differs) {
    void row.offsetWidth
    row.classList.add('fresh')
  }
}

function tickAges() {
  for (const row of table.children) {
    const group = groups.get(row.dataset.key)
    const [read, changed] = row.querySelectorAll('.age')

    read.textContent = age(group.latest.at)
    changed.textContent = age(group.changedAt)
  }
}

function statusText() {
  if (phase === 'reading') return reading > 0 ? `Reading history · ${reading.toLocaleString()} entries so far` : 'Reading history'

  const place = phase === 'range' ? `${filter.from.replace('T', ' ')} to ${filter.to.replace('T', ' ')}` : `${connected ? 'Live' : 'Reconnecting'} · since ${clock.format(new Date(openedAt))} ET${Date.now() - liveSince >= 60000 ? ` · ${recent.length.toLocaleString()} in the last minute` : ''}`
  const capped = matched > kept ? ` · this page keeps the newest ${kept.toLocaleString()}` : ''
  const amount = filter.view === 'table' ? `${shown.toLocaleString()} of ${groups.size.toLocaleString()} properties` : `showing ${shown.toLocaleString()} of ${matched.toLocaleString()}${capped}`

  return `${place} · ${amount}${paused ? ` · paused, ${held.length.toLocaleString()} held` : ''}`
}

function showStatus() {
  const now = Date.now()

  while (recent.length > 0 && now - recent[0] > 60000) recent.shift()
  statusLine.textContent = statusText()
  statusLine.classList.toggle('down', phase === 'live' && !connected)
  empty.hidden = shown > 0 || phase === 'reading'
  empty.textContent = 'Nothing matches in this window.'
}

function windowStart() {
  return Date.now() - (windows.find(([, key]) => key === filter.window) ?? windows[0])[2]
}

function eventsUrl() {
  const query = new URLSearchParams()

  if (filter.window === 'range') {
    query.set('since', String(new Date(filter.from).getTime()))
    query.set('until', String(new Date(filter.to).getTime()))
  } else {
    openedAt = windowStart()
    query.set('since', String(openedAt))
  }
  if (filter.view === 'table') {
    query.set('table', '')

    return `events?${query}`
  }
  if (filter.show.size > 0) query.set('show', [...filter.show].join(','))
  if (filter.commands) query.set('commands', '')
  if (filter.problems) query.set('problems', '')
  if (filter.changes) query.set('changes', '')

  return `events?${query}`
}

function openEvents() {
  events?.close()
  rows.querySelectorAll('.row').forEach(row => row.remove())
  table.replaceChildren()
  groups.clear()
  rows.hidden = filter.view === 'table'
  table.hidden = filter.view !== 'table'
  document.getElementById('logColumns').hidden = filter.view === 'table'
  document.getElementById('tableColumns').hidden = filter.view !== 'table'
  counts.clear()
  held.length = 0
  recent.length = 0
  shown = 0
  kept = 0
  matched = 0
  reading = 0
  phase = 'reading'
  saveFilter()
  drawChips()

  events = new EventSource(eventsUrl())
  events.onopen = () => { connected = true; showStatus() }
  events.onerror = () => { connected = false; showStatus() }
  events.addEventListener('progress', event => {
    reading = JSON.parse(event.data).read
    showStatus()
  })
  events.addEventListener('history', event => {
    const { entries, groups: latest, ...added } = JSON.parse(event.data)

    addCounts(added)
    addHistory(entries)
    for (const group of latest) groups.set(group.group, group)
    if (filter.view === 'table') drawTable()
    phase = 'live'
    liveSince = Date.now()
    drawChips()
    showStatus()
  })
  events.addEventListener('end', () => {
    events.close()
    phase = 'range'
    showStatus()
  })
  events.addEventListener('counts', event => addCounts(JSON.parse(event.data)))
  events.addEventListener('message', event => {
    const message = JSON.parse(event.data)

    recent.push(message.at)
    if (filter.view === 'table') {
      if (!paused) updateGroup(message)
    } else if (paused) held.push(message)
    else add(message)
  })
  showStatus()
}

search.addEventListener('input', applyFilter)

document.getElementById('clear').addEventListener('click', () => {
  search.value = ''
  filter.show.clear()
  filter.hidden.clear()
  filter.commands = false
  filter.problems = false
  filter.changes = false
  openEvents()
})

document.getElementById('apply').addEventListener('click', () => {
  filter.from = document.getElementById('from').value
  filter.to = document.getElementById('to').value
  if (filter.from !== '' && filter.to !== '') openEvents()
})
document.getElementById('from').value = filter.from
document.getElementById('to').value = filter.to
if (filter.from !== '' && filter.to !== '') filter.window = 'range'

pauseButton.addEventListener('click', () => {
  paused = !paused
  pauseButton.textContent = paused ? 'Resume' : 'Pause'
  if (!paused) for (const message of held.splice(0)) add(message)
  showStatus()
})

rows.addEventListener('click', event => {
  const row = event.target.closest('.row')

  if (row && getSelection().isCollapsed) toggle(row)
})
table.addEventListener('click', event => {
  const key = event.target.closest('.row')?.dataset.key
  const group = groups.get(key)

  if (group === undefined) return

  const view = groupView(group)

  filter.view = 'log'
  filter.show = new Set([view.source])
  search.value = `what:${view.what}`
  openEvents()
})
table.addEventListener('keydown', event => {
  if (event.key === 'Enter') event.target.click()
})
rows.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.classList.contains('row')) toggle(event.target)
})

openEvents()
setInterval(() => {
  tickAges()
  showStatus()
  for (const number of document.querySelectorAll('[data-count]')) number.textContent = (counts.get(number.dataset.count) ?? 0).toLocaleString()
}, 1000)
</script>
</body>
</html>
